# HondaLink - Mushroom dashboard view
#
# Requires the "Mushroom" custom card (install via HACS > Frontend > Mushroom).
# Uses only Mushroom cards plus Home Assistant's built-in grid and map cards,
# so no other custom cards are needed.
#
# Setup:
#   1. Find your vehicle's entity ID prefix: Settings > Devices & services >
#      Devices > your Honda device > any entity, e.g. "sensor.accord_fuel_level".
#      Everything before the last "_<sensor name>" is the prefix.
#   2. In this file, replace every occurrence of VEHICLE with that prefix
#      (find & replace works well since it only appears in entity IDs below).
#   3. Add this as a new view: open a dashboard > Edit Dashboard > "+" (Add
#      view) > three-dot menu on the new view > "Edit in YAML", then paste
#      everything below "views:" -> the single list item (the "- title: Honda"
#      block). Or create a brand new dashboard from scratch and paste this
#      whole file in dashboard YAML mode.
#
# Tire pressure, oil life, and cabin temperature sensors report "unknown"
# until your vehicle has actually reported that data (see the README's
# Troubleshooting and Known Limitations sections) - that's expected, not
# a dashboard problem.

title: Honda
views:
  - title: Honda
    path: honda
    icon: mdi:car-side
    type: masonry
    cards:
      - type: custom:mushroom-template-card
        primary: My Honda
        secondary: >-
          {% set ts = states('sensor.VEHICLE_last_update') %}
          {% if ts not in ('unknown', 'unavailable', none) %}
            Updated {{ relative_time(as_datetime(ts)) }} ago
          {% else %}
            Never updated
          {% endif %}
        icon: mdi:car-side
        icon_color: blue
        tap_action:
          action: more-info
        entity: sensor.VEHICLE_last_update

      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: entity
            entity: sensor.VEHICLE_fuel_level
            icon: mdi:gas-station
          - type: entity
            entity: sensor.VEHICLE_range
            icon: mdi:map-marker-distance
          - type: entity
            entity: sensor.VEHICLE_odometer
            icon: mdi:counter
          - type: entity
            entity: sensor.VEHICLE_oil_life
            icon: mdi:oil
          - type: entity
            entity: sensor.VEHICLE_12v_battery_status
            icon: mdi:car-battery
          - type: entity
            entity: sensor.VEHICLE_cabin_temperature
            icon: mdi:thermometer

      - type: custom:mushroom-lock-card
        entity: lock.VEHICLE_doors
        name: Doors
        icon_animation: true
        layout: horizontal

      - type: custom:mushroom-title-card
        title: Vehicle status
        alignment: start

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: binary_sensor.VEHICLE_any_door_open
            name: Doors
          - type: custom:mushroom-entity-card
            entity: binary_sensor.VEHICLE_any_window_open
            name: Windows
          - type: custom:mushroom-entity-card
            entity: binary_sensor.VEHICLE_hood_open
            name: Hood
          - type: custom:mushroom-entity-card
            entity: binary_sensor.VEHICLE_trunk_open
            name: Trunk
          - type: custom:mushroom-entity-card
            entity: binary_sensor.VEHICLE_any_light_on
            name: Lights
          - type: custom:mushroom-entity-card
            entity: binary_sensor.VEHICLE_warning_lamp_on
            name: Warning lamp
          - type: custom:mushroom-entity-card
            entity: binary_sensor.VEHICLE_remote_engine_running
            name: Engine running
          - type: custom:mushroom-entity-card
            entity: sensor.VEHICLE_vehicle_speed
            name: Speed

      - type: custom:mushroom-title-card
        title: Tire pressure
        alignment: start

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.VEHICLE_front_left_tire_pressure
            name: Front left
            icon: mdi:tire
          - type: custom:mushroom-entity-card
            entity: sensor.VEHICLE_front_right_tire_pressure
            name: Front right
            icon: mdi:tire
          - type: custom:mushroom-entity-card
            entity: sensor.VEHICLE_rear_left_tire_pressure
            name: Rear left
            icon: mdi:tire
          - type: custom:mushroom-entity-card
            entity: sensor.VEHICLE_rear_right_tire_pressure
            name: Rear right
            icon: mdi:tire

      - type: custom:mushroom-title-card
        title: Remote actions
        alignment: start

      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: button.VEHICLE_start_engine
            name: Start
            icon: mdi:engine
            icon_color: green
          - type: custom:mushroom-entity-card
            entity: button.VEHICLE_stop_engine
            name: Stop
            icon: mdi:engine-off
            icon_color: red
          - type: custom:mushroom-entity-card
            entity: button.VEHICLE_horn
            name: Horn
            icon: mdi:bullhorn
          - type: custom:mushroom-entity-card
            entity: button.VEHICLE_lights
            name: Lights
            icon: mdi:car-light-high
          - type: custom:mushroom-entity-card
            entity: button.VEHICLE_stop_horn_lights
            name: Stop alert
            icon: mdi:car-light-alert
          - type: custom:mushroom-entity-card
            entity: button.VEHICLE_refresh
            name: Refresh
            icon: mdi:refresh

      - type: map
        entities:
          - entity: device_tracker.VEHICLE_location
        default_zoom: 14
        hours_to_show: 0
