# HondaLink - Dashboard view
#
# Uses only built-in Home Assistant cards (tile, heading, markdown, map).
# No custom cards required.
#
# Setup:
#   1. Find your vehicle's entity ID prefix: Settings > Devices & services >
#      Devices > your Honda device > any entity, e.g. "sensor.accord_fuel_level".
#      Everything before the last "_<sensor name>" is the prefix.
#   2. In this file, replace every occurrence of VEHICLE with that prefix
#      (find & replace works well since it only appears in entity IDs below).
#   3. Add this as a new view: open a dashboard > Edit Dashboard > "+" (Add
#      view) > three-dot menu on the new view > "Edit in YAML", then paste
#      everything below "views:" -> the single list item (the "- title: Honda"
#      block). Or create a brand new dashboard from scratch and paste this
#      whole file in dashboard YAML mode.
#
# Tire pressure, oil life, and cabin temperature sensors report "unknown"
# until your vehicle has actually reported that data (see the README's
# Troubleshooting and Known Limitations sections) - that's expected, not
# a dashboard problem.

title: Honda
views:
  - title: Honda
    path: honda
    type: sections
    icon: mdi:car-side
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: My Honda
            heading_style: title
            icon: mdi:car-side
          - type: markdown
            text_only: true
            entity_id:
              - sensor.VEHICLE_last_update
            content: >-
              {% set ts = states('sensor.VEHICLE_last_update') %}{% if ts
              not in ('unknown','unavailable',none) %}Updated {{
              relative_time(as_datetime(ts)) }} ago{% else %}Never updated{% endif
              %}
          - type: tile
            entity: lock.VEHICLE_doors
            name: Doors
            features:
              - type: lock-commands
            grid_options:
              columns: 12
              rows: 1

      - type: grid
        cards:
          - type: heading
            heading: Recall alerts
            heading_style: subtitle
            icon: mdi:alert-circle
          - type: tile
            entity: binary_sensor.VEHICLE_active_recall
            name: Active recalls
            icon: mdi:car-wrench
            grid_options:
              columns: 6
          - type: tile
            entity: button.VEHICLE_check_recalls
            name: Check now
            icon: mdi:refresh
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.VEHICLE_check_recalls
            grid_options:
              columns: 6
          - type: markdown
            content: >-
              {% set recalls =
              state_attr('binary_sensor.VEHICLE_active_recall', 'recalls') or []
              %}{% if recalls | length == 0 %}No recalls found for this
              vehicle.{% else %}{% for r in recalls %}**{{ r.campaign_number
              }}** — {{ r.component }}

              {{ r.summary }}

              **Remedy:** {{ r.remedy }}

              {% if not loop.last %}---{% endif %}

              {% endfor %}{% endif %}
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Vehicle status
            heading_style: subtitle
          - type: tile
            entity: binary_sensor.VEHICLE_any_door_open
            name: Doors
            grid_options:
              columns: 4
          - type: tile
            entity: binary_sensor.VEHICLE_any_window_open
            name: Windows
            grid_options:
              columns: 4
          - type: tile
            entity: binary_sensor.VEHICLE_hood_open
            name: Hood
            grid_options:
              columns: 4
          - type: tile
            entity: binary_sensor.VEHICLE_trunk_open
            name: Trunk
            grid_options:
              columns: 4
          - type: tile
            entity: binary_sensor.VEHICLE_any_light_on
            name: Lights
            grid_options:
              columns: 4
          - type: tile
            entity: binary_sensor.VEHICLE_remote_engine_running
            name: Engine running
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.VEHICLE_vehicle_speed
            name: Speed
            grid_options:
              columns: 4

      - type: grid
        cards:
          - type: heading
            heading: Vehicle info
            heading_style: subtitle
          - type: tile
            entity: sensor.VEHICLE_fuel_level
            name: Fuel level
            icon: mdi:gas-station
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.VEHICLE_range
            name: Range
            icon: mdi:map-marker-distance
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.VEHICLE_odometer
            name: Odometer
            icon: mdi:counter
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.VEHICLE_oil_life
            name: Oil life
            icon: mdi:oil
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.VEHICLE_cabin_temperature
            name: Cabin temp
            icon: mdi:thermometer
            grid_options:
              columns: 4

      - type: grid
        cards:
          - type: heading
            heading: Remote actions
            heading_style: subtitle
          - type: tile
            entity: button.VEHICLE_start_engine
            name: Start
            icon: mdi:engine
            color: green
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.VEHICLE_start_engine
            grid_options:
              columns: 4
          - type: tile
            entity: button.VEHICLE_stop_engine
            name: Stop
            icon: mdi:engine-off
            color: red
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.VEHICLE_stop_engine
            grid_options:
              columns: 4
          - type: tile
            entity: button.VEHICLE_horn
            name: Horn
            icon: mdi:bullhorn
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.VEHICLE_horn
            grid_options:
              columns: 4
          - type: tile
            entity: button.VEHICLE_lights
            name: Lights
            icon: mdi:car-light-high
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.VEHICLE_lights
            grid_options:
              columns: 4
          - type: tile
            entity: button.VEHICLE_stop_horn_lights
            name: Stop alert
            icon: mdi:car-light-alert
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.VEHICLE_stop_horn_lights
            grid_options:
              columns: 4
          - type: tile
            entity: button.VEHICLE_refresh
            name: Refresh
            icon: mdi:refresh
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.VEHICLE_refresh
            grid_options:
              columns: 4

      - type: grid
        cards:
          - type: map
            entities:
              - entity: device_tracker.VEHICLE_location
            default_zoom: 14
            hours_to_show: 0
            grid_options:
              columns: full
              rows: 6
